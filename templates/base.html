<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TweetSense AI{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #f3f4f6;
            min-height: 100vh;
        }
        nav {
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 16px;
            padding: 22px 7%;
            border-bottom: 1px solid #292b45;
        }
        .brand { color: #c4b5fd; font-size: 23px; font-weight: bold; }
        nav a {
            color: #cbd5e1; text-decoration: none;
            margin-left: 20px; font-size: 14px;
        }
        nav a:hover { color: #c4b5fd; }
        main { max-width: 1050px; margin: auto; padding: 55px 22px; }
        .hero { text-align: center; margin-bottom: 35px; }
        .tag {
            display: inline-block; color: #c4b5fd;
            background: #211b3b; padding: 9px 14px;
            border-radius: 25px; font-size: 13px; margin-bottom: 20px;
        }
        h1 { font-size: clamp(32px, 5vw, 48px); margin-bottom: 18px; }
        .accent { color: #a78bfa; }
        p { color: #aab4ca; line-height: 1.8; }
        .panel {
            max-width: 720px; margin: 25px auto; padding: 28px;
            background: #141a2e; border: 1px solid #30334f;
            border-radius: 18px;
        }
        label { display: block; margin-bottom: 12px; font-weight: bold; }
        textarea {
            width: 100%; min-height: 135px; resize: vertical;
            padding: 16px; border-radius: 12px;
            background: #0b1020; border: 1px solid #414364;
            color: white; font: inherit; margin-bottom: 18px;
        }
        textarea:focus { outline: 2px solid #8b5cf6; }
        button, .btn {
            display: inline-block; border: none; cursor: pointer;
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            color: white; padding: 13px 22px;
            border-radius: 10px; font-weight: bold; text-decoration: none;
        }
        button:hover, .btn:hover { opacity: .88; }
        .result {
            padding: 18px; margin-top: 22px; border-radius: 12px;
            background: #20213a; border: 1px solid #51447a;
        }
        .positive { color: #86efac; }
        .negative { color: #fca5a5; }
        .cards {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px; margin-top: 28px;
        }
        .card {
            padding: 24px; background: #141a2e;
            border: 1px solid #30334f; border-radius: 16px;
        }
        .card h3 { margin-bottom: 12px; color: #c4b5fd; }
        footer {
            text-align: center; padding: 25px;
            border-top: 1px solid #292b45; color: #8993aa;
            font-size: 13px;
        }
        @media (max-width: 600px) {
            nav { padding: 18px 5%; }
            nav a { margin-left: 10px; }
            main { padding: 38px 16px; }
            .panel { padding: 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">✦ TweetSense AI</div>
        <div>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/results">Results</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>TweetSense AI · Machine Learning Sentiment Analysis Project</footer>
</body>
</html>
